name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          xcodebuild \
            -project earth-backgrounds.xcodeproj \
            -scheme earth-backgrounds \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign (ad-hoc)
        run: |
          codesign --force --deep --sign - \
            build/Build/Products/Release/Earth Backgrounds.app

      - name: Package DMG
        run: |
          APP=build/Build/Products/Release/Earth Backgrounds.app
          STAGING=$(mktemp -d)
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Earth Backgrounds" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            build/Build/Products/Release/EarthBackgrounds.dmg

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/EarthBackgrounds.dmg
          generate_release_notes: true
